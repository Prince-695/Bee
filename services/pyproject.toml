[project]
name = "bee-services"
version = "0.1.0"
description = "Bee internal intelligence and execution services"
requires-python = ">=3.11"
dependencies = [
  "bee-core",
  "bee-hive",
  "bee-logging",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
