[project]
name = "bee-core"
version = "0.1.0"
description = "Bee brain — Route/Flight runtime and stores"
requires-python = ">=3.11"
dependencies = [
  "bee-hive",
  "bee-logging",
  "openai==2.31.0",
  "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
