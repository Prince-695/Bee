[project]
name = "bee-worker"
version = "0.1.0"
description = "Bee Flight worker — durable deferred Flights"
requires-python = ">=3.11"
dependencies = [
  "bee-core",
  "bee-hive",
  "bee-logging",
]

[project.scripts]
bee-worker = "bee_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
