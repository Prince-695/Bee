name: Bee CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Create venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e packages/python/bee-logging
          pip install -e packages/python/bee-hive
          pip install -e packages/python/bee-core
          pip install -e apps/api
      - name: Unit tests
        run: |
          . .venv/bin/activate
          pytest apps/api/tests
      - name: OpenAPI export smoke
        run: |
          . .venv/bin/activate
          python -c "from bee_api.main import app; assert app.openapi()"
      - name: Codegen drift check
        run: |
          . .venv/bin/activate
          pnpm install
          pnpm codegen:check
