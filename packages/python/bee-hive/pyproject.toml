[project]
name = "bee-hive"
version = "0.1.0"
description = "Bee Hive Registry and MCP client"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.27.0",
  "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
